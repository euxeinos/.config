config-version = 2
after-login-command = []
after-startup-command = []
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]

automatically-unhide-macos-hidden-apps = true

# ==============================================================================
# 1. Workspace to monitor assignment
# ==============================================================================

[workspace-to-monitor-force-assignment]
E = ['^LG', 'secondary'] # Emacs
G = ['^LG', 'secondary'] # Ghostty
S = ['^LG', 'secondary'] # Safari

C = ['built-in', 'main'] # ChatGPT
M = ['built-in', 'main'] # Gemini
F = ['built-in', 'main'] # Finder, System Settings
R = ['built-in', 'main'] # Reminders
P = ['built-in', 'main'] # Preview
L = ['built-in', 'main'] # NTS Radio
A = ['built-in', 'main'] # Anki
Z = ['built-in', 'main'] # Zen
N = ['built-in', 'main'] # Notes
D = ['built-in', 'main'] # Mail
Y = ['built-in', 'main'] # AyuGram
B = ['built-in', 'main'] # calibre


[key-mapping]
preset = 'qwerty'

# ==============================================================================
# 2. Gaps
# ==============================================================================

[gaps]
inner.horizontal = 3
inner.vertical = 3

outer.left = [{ monitor."^LG" = 0 }, { monitor.main = 3 }, 0]
outer.bottom = [{ monitor."^LG" = 0 }, { monitor.main = 3 }, 0]
outer.top = [{ monitor."^LG" = 0 }, { monitor.main = 0 }, 0]
outer.right = [{ monitor."^LG" = 0 }, { monitor.main = 3 }, 0]

# ==============================================================================
# 3. Main mode
# ==============================================================================

[mode.main.binding]

# --- Layout ---
ctrl-alt-cmd-slash = 'layout tiles horizontal vertical'
ctrl-alt-cmd-comma = 'layout accordion horizontal vertical'

# --- Focus ---
ctrl-alt-cmd-left = 'focus left'
ctrl-alt-cmd-down = 'focus down'
ctrl-alt-cmd-up = 'focus up'
ctrl-alt-cmd-right = 'focus right'

# --- Move windows ---
ctrl-alt-cmd-shift-left = 'move left'
ctrl-alt-cmd-shift-down = 'move down'
ctrl-alt-cmd-shift-up = 'move up'
ctrl-alt-cmd-shift-right = 'move right'

# --- Resize ---
ctrl-alt-cmd-minus = 'resize smart -50'
ctrl-alt-cmd-equal = 'resize smart +50'

# --- Fixed workspaces ---
ctrl-alt-cmd-a = 'workspace A'
ctrl-alt-cmd-b = 'workspace B'
ctrl-alt-cmd-c = 'workspace C'
ctrl-alt-cmd-d = 'workspace D'
ctrl-alt-cmd-e = 'workspace E'
ctrl-alt-cmd-f = 'workspace F'
ctrl-alt-cmd-g = 'workspace G'
ctrl-alt-cmd-l = 'workspace L'
ctrl-alt-cmd-m = 'workspace M'
ctrl-alt-cmd-n = 'workspace N'
ctrl-alt-cmd-p = 'workspace P'
ctrl-alt-cmd-r = 'workspace R'
ctrl-alt-cmd-s = 'workspace S'
ctrl-alt-cmd-y = 'workspace Y'
ctrl-alt-cmd-z = 'workspace Z'

# --- Dynamic workspaces ---
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'
ctrl-alt-cmd-4 = 'workspace 4'
ctrl-alt-cmd-5 = 'workspace 5'

# --- Move to fixed workspaces ---
ctrl-alt-cmd-shift-a = 'move-node-to-workspace A --focus-follows-window'
ctrl-alt-cmd-shift-b = 'move-node-to-workspace B --focus-follows-window'
ctrl-alt-cmd-shift-c = 'move-node-to-workspace C --focus-follows-window'
ctrl-alt-cmd-shift-d = 'move-node-to-workspace D --focus-follows-window'
ctrl-alt-cmd-shift-e = 'move-node-to-workspace E --focus-follows-window'
ctrl-alt-cmd-shift-f = 'move-node-to-workspace F --focus-follows-window'
ctrl-alt-cmd-shift-g = 'move-node-to-workspace G --focus-follows-window'
ctrl-alt-cmd-shift-l = 'move-node-to-workspace L --focus-follows-window'
ctrl-alt-cmd-shift-m = 'move-node-to-workspace M --focus-follows-window'
ctrl-alt-cmd-shift-n = 'move-node-to-workspace N --focus-follows-window'
ctrl-alt-cmd-shift-p = 'move-node-to-workspace P --focus-follows-window'
ctrl-alt-cmd-shift-r = 'move-node-to-workspace R --focus-follows-window'
ctrl-alt-cmd-shift-s = 'move-node-to-workspace S --focus-follows-window'
ctrl-alt-cmd-shift-y = 'move-node-to-workspace Y --focus-follows-window'
ctrl-alt-cmd-shift-z = 'move-node-to-workspace Z --focus-follows-window'

# --- Move to dynamic workspaces ---
ctrl-alt-cmd-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
ctrl-alt-cmd-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
ctrl-alt-cmd-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
ctrl-alt-cmd-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
ctrl-alt-cmd-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'

# --- Dual monitor navigation ---
ctrl-alt-cmd-o = 'focus-monitor --wrap-around next'
ctrl-alt-cmd-shift-o = 'move-node-to-monitor --wrap-around next'
ctrl-alt-cmd-shift-period = 'move-workspace-to-monitor --wrap-around next'

# --- Fullscreen and utilities ---
ctrl-alt-cmd-t = 'fullscreen'
ctrl-alt-cmd-tab = ['workspace-back-and-forth']
alt-tab = ['focus-back-and-forth']
ctrl-cmd-shift-semicolon = 'mode service'

# --- Join / accordion helpers ---
ctrl-alt-j = ['join-with left', 'layout accordion horizontal vertical']
ctrl-alt-l = ['join-with down']
ctrl-alt-u = ['join-with up']
ctrl-alt-y = ['join-with right']

# ==============================================================================
# 4. Service mode
# ==============================================================================

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# ==============================================================================
# 5. Automatic application placement
# ==============================================================================

# Emacs
[[on-window-detected]]
if.app-name-regex-substring = 'emacs'
run = ['layout tiling', 'move-node-to-workspace E']

# ChatGPT Classic
[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = ['layout tiling', 'move-node-to-workspace C']

# Gemini
[[on-window-detected]]
if.app-id = 'com.google.GeminiMacOS'
run = ['layout tiling', 'move-node-to-workspace M']

# Ghostty
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout tiling', 'move-node-to-workspace G']

# Safari
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['layout tiling', 'move-node-to-workspace S']

# Finder
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout tiling', 'move-node-to-workspace F']

# Reminders
[[on-window-detected]]
if.app-id = 'com.apple.reminders'
run = ['layout tiling', 'move-node-to-workspace R']

# Preview
[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = ['layout tiling', 'move-node-to-workspace P']

# NTS Radio
[[on-window-detected]]
if.app-id = 'com.ntslive.ntsradio'
run = ['layout tiling', 'move-node-to-workspace L']

# Anki
[[on-window-detected]]
if.app-id = 'net.ankiweb.anki'
run = ['layout tiling', 'move-node-to-workspace A']

# Zen
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['layout tiling', 'move-node-to-workspace Z']

# Notes
[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = ['layout tiling', 'move-node-to-workspace N']

# Mail
[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['layout tiling', 'move-node-to-workspace D']

# AyuGram
[[on-window-detected]]
if.app-id = 'one.ayugram.AyuGramDesktop'
run = ['layout tiling', 'move-node-to-workspace Y']

# calibre
[[on-window-detected]]
if.app-id = 'net.kovidgoyal.calibre'
run = ['layout tiling', 'move-node-to-workspace B']

# System Settings
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout tiling', 'move-node-to-workspace F']